name: bake-debian

# Workflow-dispatch only, on purpose.
#
# These used to run on push with paths: filters, and bake/nixos/smoke.sh plus
# bake/lib/** appear in every one of those lists - so a one-line fix to the shared
# harness started all six bakes, fifteen minutes each, when one of them was the
# thing being worked on. Nothing here runs unless someone asks for it.
# Bake a Debian desktop disk from the official netinst with preseed, then boot it
# and prove the desktop came up - in one job.
#
# Fourth distribution. Debian's unattended mechanism is the oldest of the four
# and the one the others grew out of:
#
#   NixOS   commands typed at the serial console
#   Ubuntu  autoinstall ds=nocloud-net;s=http://...   (subiquity)
#   Fedora  inst.ks=http://...                        (anaconda)
#   Debian  auto=true preseed/url=http://...           (debian-installer)

on:
  workflow_dispatch:
    inputs:
      desktops:
        description: "Comma-separated: gnome, kde, xfce, cinnamon"
        required: false
        default: "gnome"
      debian_version:
        description: "Debian point release, e.g. 13.7.0"
        required: false
        default: "13.7.0"
env:
  DESKTOPS: ${{ github.event.inputs.desktops || 'gnome' }}
  DEBIAN_VERSION: ${{ github.event.inputs.debian_version || '13.7.0' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktops: ${{ steps.m.outputs.desktops }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          json=$(printf '%s' "${DESKTOPS}" \
            | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "desktops=${json}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${json}"

  bake:
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/easydev-org/sandbox-bake-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.plan.outputs.desktops) }}
    steps:
      - uses: actions/checkout@v4

      # No apt. This job runs inside bake/Containerfile.runner, which is
      # qemux/qemu:7.50 - the same base the production image is built from - and
      # already carries qemu 11.1.0, 7z, xorriso, python3, e2fsprogs and jq. The
      # apt install it replaces took 36s once and 374s another time for the same
      # commit; the difference was the mirror, and under -qq the slow case printed
      # nothing at all and looked like a deadlock.
      - name: tools
        run: |
          . bake/lib/qemu-bake.sh
          bake_require_tools
        shell: bash
      # /dev/kvm is passed to the container by the job definition, so this only
      # reports it. The udev rules the runner-level version wrote are not needed
      # inside a container that was started with the device.
      - name: KVM is available
        run: |
          ls -l /dev/kvm || { echo "no /dev/kvm - the job needs --device /dev/kvm" >&2; exit 1; }
        shell: bash
      - name: bake
        env:
          DESKTOP: ${{ matrix.desktop }}
          OUT: ${{ github.workspace }}/out/debian-${{ matrix.desktop }}.qcow2
          DEBIAN_VERSION: ${{ env.DEBIAN_VERSION }}
          QEMU_MAX: "3600"
        # Streamed, like the smoke step, and for the same reason: the Actions log
        # of a running job is not readable through any public API. The first
        # Debian bake sat for 24 minutes with nothing visible, and when the log
        # finally arrived the answer was one line -
        #   Failed to run preseeded command ... exit code 127
        # - which a live view would have shown at minute two.
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: bake-debian-${{ matrix.desktop }}
          interval: "10"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            mkdir -p out
            bash bake/debian/bake-debian.sh
            ls -la out

      - name: what the installer said
        if: always()
        run: |
          ls -la out/ 2>/dev/null || true
          if [ -f out/console.log ]; then
            echo "=== console: $(wc -l < out/console.log) lines ==="
            grep -aE "ERROR|Traceback|preseed|DEBIAN_BAKE_OK|Installation complete|failed|debconf" \
              out/console.log | tail -40 || true
          fi
        shell: bash
      # Same harness every disk gets. Streamed, so this can be watched live
      # instead of only read after the fact.
      - name: boot it and look at the screen
        if: success()
        env:
          DESKTOP: ${{ matrix.desktop }}
          DISK: ${{ github.workspace }}/out/debian-${{ matrix.desktop }}.qcow2
          WAIT: "600"
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: smoke-debian-${{ matrix.desktop }}
          interval: "10"
          command: |
            set -euo pipefail
            bash bake/nixos/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-${{ matrix.desktop }}-result
          path: |
            out/console.log
            screen.png
            smoke.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debian-${{ matrix.desktop }}
          path: out/debian-${{ matrix.desktop }}.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
