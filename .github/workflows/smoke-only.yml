name: smoke-only

# Run the boot test against a disk that ALREADY EXISTS.
#
# Every round of fixing smoke.sh so far re-baked a distribution first: 8 minutes
# for Ubuntu, 13 for Fedora, and the thing under test was a shell script. This
# workflow takes a run id and a disk artifact name and does only the part that is
# being worked on.
#
# The disk is a published artifact of an earlier bake-<distro> run. Artifacts are
# scoped to their run, so the run id is required - there is no "latest" lookup
# that is not a lie when several bakes are in flight.

on:
  workflow_dispatch:
    inputs:
      disk_run_id:
        description: "Run that produced the disk artifact (e.g. 40385961525)"
        required: true
      disk_artifact:
        description: "Artifact name holding the qcow2 (e.g. fedora-workstation)"
        required: true
      desktop:
        description: "Label for the log, e.g. fedora or ubuntu"
        required: false
        default: "disk"
      wait:
        description: "Seconds to allow for boot"
        required: false
        default: "600"
      stall_seconds:
        description: "Console silence before the guest is declared dead"
        required: false
        default: "600"

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/easydev-org/sandbox-bake-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 40
    permissions:
      contents: read
      # The log-stream action creates and updates a check run; the Actions log of
      # a running job is not readable through any public API, but a check run's
      # output.text is. That is what makes it possible to watch this job instead
      # of waiting for it to finish or cancelling it to read the log.
      checks: write
    steps:
      - uses: actions/checkout@v4

      # No apt: the job runs inside bake/Containerfile.runner, which carries qemu,
      # 7z and e2fsprogs already and is the base the production image uses. This
      # workflow exists to test the harness quickly, so paying a slow mirror for
      # qemu on every run was the worst possible place for it.
      - name: tools
        run: |
          . bake/lib/qemu-bake.sh
          bake_require_tools
        shell: bash
      - name: KVM is available
        run: ls -l /dev/kvm || { echo "no /dev/kvm - the job needs --device /dev/kvm" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.disk_artifact }}
          path: disk
          run-id: ${{ github.event.inputs.disk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: boot it and look at the screen
        env:
          DESKTOP: ${{ github.event.inputs.desktop }}
          DISK: ${{ github.workspace }}/disk
          WAIT: ${{ github.event.inputs.wait }}
          BAKE_STALL_SECONDS: ${{ github.event.inputs.stall_seconds }}
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: smoke-${{ github.event.inputs.desktop }}
          interval: "10"
          # DISK arrives as a DIRECTORY (set in env above) rather than a resolved
          # file. smoke.sh accepts either now, so there is nothing here to forget
          # to export - which is the mistake that was made twice, in two
          # different workflow files.
          command: |
            set -euo pipefail
            ls -la "$DISK"
            bash bake/nixos/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-only-${{ github.event.inputs.desktop }}
          path: |
            screen.png
            smoke.log
            shots-smoke/*.ppm
            shots-smoke/frames.txt
            shots-smoke/snapshots.log
          if-no-files-found: warn
          retention-days: 7
