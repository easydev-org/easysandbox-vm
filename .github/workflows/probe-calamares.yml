name: probe-calamares

# Find out what EndeavourOS's Calamares actually puts on screen.
#
# EndeavourOS ships Calamares and nothing else - no archinstall, no CLI
# installer - so the only way to install it unattended is to drive the keyboard.
# And the only way to drive a keyboard sensibly is to know what is on the screen:
# which page comes first, where its buttons are, whether the window is even legible
# at 1280x800.
#
# So this installs nothing. It boots the live ISO, sends no keys, and photographs
# the framebuffer four times over four minutes. The images come back as artifacts.
#
# It is one workflow rather than a step in bake-endeavouros because the answer
# decides whether bake-endeavouros should exist.

on:
  workflow_dispatch:
    inputs:
      endeavouros_version:
        description: "EndeavourOS release, e.g. 2026.08.15"
        required: false
        default: "2026.08.15"

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/easydev-org/sandbox-bake-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: tools
        shell: bash
        run: |
          . bake/lib/qemu-bake.sh
          bake_require_tools

      - name: KVM is available
        shell: bash
        run: ls -l /dev/kvm

      - name: boot and photograph
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: probe-calamares
          command: |
            set -euo pipefail
            mkdir -p out
            # env: is not allowed beside uses:, so the values are exported here.
            export ENDEAVOUROS_VERSION="${{ github.event.inputs.endeavouros_version }}"
            export OUTDIR="$PWD/out"
            bash bake/endeavouros/probe-calamares.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calamares-probe
          path: |
            out/shot-*.png
            out/console.log
          if-no-files-found: warn
          retention-days: 14
