name: bake-ubuntu

# Bake an Ubuntu desktop disk from the official live-server ISO with
# autoinstall, then boot it and prove the desktop came up - in ONE job.
#
# WHY ONE JOB, AND NOT bake + smoke
#
# The first version split them, and the split cost more than it bought:
#
#   * tools were installed twice. On a cold runner `apt-get update` alone ran
#     for 14 minutes once, so the split doubled the exposure to that;
#   * the disk (4.8 GiB) was uploaded and downloaded - 8 minutes of pure
#     transfer, measured;
#   * the artifact is scoped to the run that produced it, so a smoke-only rerun
#     could not find its disk without naming a run id, which is a sharp edge for
#     no benefit.
#
# Two separate jobs make sense when the smoke can be rerun against a published
# disk without rebaking. Nothing publishes these disks yet, so there was nothing
# to reuse: keeping them apart was copying a NixOS assumption into a repository
# where it does not hold.
#
# WHAT IS DIFFERENT FROM THE NIXOS BAKE
#
#   * no shared base. Ubuntu has no nixos-rebuild, so each desktop is a full
#     install. Three flavours here means three installs.
#   * no serial typing. subiquity reads user-data over HTTP; the bake script
#     never types into the guest.
#   * the release is pinned (26.04.1). autoinstall keys and the casper layout
#     are stable within a release and not across them.

on:
  workflow_dispatch:
    inputs:
      desktops:
        description: "Comma-separated: ubuntu (GNOME), kubuntu (KDE), xubuntu (XFCE)"
        required: false
        default: "ubuntu"
      ubuntu_version:
        description: "Ubuntu point release, e.g. 26.04.1"
        required: false
        default: "26.04.1"
  push:
    branches: [main]
    paths:
      - "bake/ubuntu/**"
      # It now sources bake/lib/qemu-bake.sh, so a change there has to
      # re-validate this distribution. Missing this is how a shared-file edit
      # goes out untested for one distribution but not the others.
      - "bake/lib/**"
      # The smoke phase runs bake/nixos/smoke.sh, so a change there has to
      # re-validate this distribution too.
      - "bake/nixos/smoke.sh"
      - ".github/workflows/bake-ubuntu.yml"

env:
  # A matrix has to be a literal JSON array, so the comma-separated input is
  # split in a small job rather than in a nested fromJSON(format(...)).
  DESKTOPS: ${{ github.event.inputs.desktops || 'ubuntu' }}
  UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || '26.04.1' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktops: ${{ steps.m.outputs.desktops }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          json=$(printf '%s' "${DESKTOPS}" \
            | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "desktops=${json}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${json}"

  bake:
    needs: plan
    runs-on: ubuntu-latest
    # The Ubuntu install is 10-15 minutes and the boot test about ten.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.plan.outputs.desktops) }}
    steps:
      - uses: actions/checkout@v4

      # One apt call for both phases, through the lib so all three distributions
      # use the same mirror logic - see bake_install_tools for why the mirror is
      # the thing that matters here.
      - name: tools
        run: |
          . bake/lib/qemu-bake.sh
          bake_install_tools

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "no /dev/kvm" >&2; exit 1; }

      - name: bake
        env:
          DESKTOP: ${{ matrix.desktop }}
          OUT: ${{ github.workspace }}/out/ubuntu-${{ matrix.desktop }}.qcow2
          UBUNTU_VERSION: ${{ env.UBUNTU_VERSION }}
          QEMU_MAX: "3600"
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: bake-ubuntu-${{ matrix.desktop }}
          command: |
            set -euo pipefail
            mkdir -p out
            sudo -E bash bake/ubuntu/bake-ubuntu.sh
            ls -la out

      - name: what the installer said
        if: always()
        run: |
          ls -la out/ 2>/dev/null || true
          if [ -f out/console.log ]; then
            echo "=== console: $(wc -l < out/console.log) lines ==="
            grep -aE "ERROR|Traceback|late-command|UBUNTU_BAKE_OK|Installation complete|failed" \
              out/console.log | tail -40 || true
          fi

      # Boot the disk this job just made. Same harness the NixOS disks get: it
      # boots through the disk's own bootloader, waits for a session, opens a GTK
      # client over the serial console, screenshots the framebuffer and rejects a
      # flat one. A disk that installs and then shows a black screen is the
      # failure this catches, and no log can show it.
      - name: boot it and look at the screen
        env:
          DESKTOP: ${{ matrix.desktop }}
          DISK: ${{ github.workspace }}/out/ubuntu-${{ matrix.desktop }}.qcow2
          WAIT: "600"
        run: |
          set -euo pipefail
          # DISK has to be exported: smoke.sh takes it with ${DISK:?...} and a
          # plain step-level env is enough, but an inline assignment would not be.
          sudo -E bash bake/nixos/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-${{ matrix.desktop }}-result
          path: |
            out/console.log
            screen.png
            smoke.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ubuntu-${{ matrix.desktop }}
          path: out/ubuntu-${{ matrix.desktop }}.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
