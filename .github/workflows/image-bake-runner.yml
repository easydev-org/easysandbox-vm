name: image-bake-runner

# Workflow-dispatch only, on purpose.
#
# These used to run on push with paths: filters, and bake/nixos/smoke.sh plus
# bake/lib/** appear in every one of those lists - so a one-line fix to the shared
# harness started all six bakes, fifteen minutes each, when one of them was the
# thing being worked on. Nothing here runs unless someone asks for it.
# Build the image the bakes run in, and push it to ghcr.
#
# Every bake step used to install qemu with apt on a GitHub runner. That install
# took 36s once and 374s another time for the same commit, and under -qq the slow
# case printed nothing at all. The image here is qemux/qemu:7.50 - the same base
# Containerfile line 43 builds the production image from - with the entrypoint
# cleared. It carries qemu 11.1.0, 7z, xorriso, python3, and e2fsprogs' debugfs,
# which is everything bake/lib needs.
#
# Built here and consumed by the bake workflows with `container:`. Building it on
# demand in each job would move the cost rather than remove it.

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sandbox-bake-runner

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # No docker/setup-buildx-action, deliberately: the default builder in the
      # ubuntu runner image has a working containerd image store and BuildKit, and
      # adding setup-buildx has broken `--load` here before (see ci.yml).
      - name: log in to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build
        run: |
          set -euo pipefail
          docker build \
            -f bake/Containerfile.runner \
            -t "${IMAGE}:${GITHUB_SHA::7}" \
            -t "${IMAGE}:latest" \
            bake/
          docker images "${IMAGE}"

      # The build has a RUN that prints every tool's version, so a missing one
      # already fails the build. This step checks the two things that cannot be
      # checked without running a VM: KVM, and that the entrypoint is gone.
      - name: it can start a guest
        run: |
          set -euo pipefail
          # The checks live in a script rather than inline: a heredoc inside
          # `docker run bash -c '...'` cannot see the outer shell's variables, and
          # the first version of this step failed on exactly that with
          #   ls: cannot access '/tmp/s.ppm': No such file or directory
          # which looked like a broken screendump and was a quoting bug.
          docker run --rm --device /dev/kvm \
            -v "$PWD:/w" -w /w \
            "${IMAGE}:${GITHUB_SHA::7}" \
            bash bake/lib/selftest-image.sh

      - name: push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"
          echo "pushed ${IMAGE}:${GITHUB_SHA::7} and :latest"
