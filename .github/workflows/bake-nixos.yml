name: bake-nixos

# Build NixOS golden disks in CI, one per desktop, all on nixpkgs-unstable.
#
# WHY NIXOS IS THE EASY ONE HERE
#
# The Debian disks are built by booting a cloud image and letting cloud-init
# mutate it - the result depends on what the scripts did at install time. A
# NixOS disk is built by nixos-install from one configuration.nix, so the
# flavours differ by a handful of declarations (services.desktopManager.*)
# instead of by thousands of lines of installer logic, and rebuilding is the
# same operation as building.
#
# WHY IN CI AT ALL
#
# Measured on a plain ubuntu-latest runner: /dev/kvm exists (root:kvm 0660) on
# an AMD host with kvm_amd nested=1, and after the standard udev rule qemu
# query-kvm reports {"enabled": true, "present": true}. So a runner can host
# the same bake the in-cluster pod does. Note the docs call nested VMs
# experimental, so this is a convenience path, not a guarantee.

on:
  workflow_dispatch:
    inputs:
      desktops:
        description: "Comma-separated: labwc,gnome,kde,cosmic,hyprland,niri,miracle"
        required: false
        default: "labwc,gnome,kde,cosmic,hyprland,niri,miracle"
      publish:
        description: "Push the resulting disks to the artifact store"
        type: boolean
        required: false
        default: false
      mode:
        description: >-
          derive = nixos-rebuild the base into each desktop; base = build the
          minimal base disk only
        type: choice
        options: ["derive", "base"]
        required: false
        default: "derive"
      base_artifact_id:
        description: >-
          Optional: reuse a nixos-base artifact from an earlier run instead of
          installing the base again. Needs base_run_id too.
        required: false
      base_run_id:
        description: "The run that produced base_artifact_id"
        required: false
  # Deliberately NO push trigger. One matrix is four half-hour installs plus four
  # multi-GiB uploads, which is not something a commit should spend on its own -
  # and it fired twice while this workflow was being written, once per commit.
  # Kick it off by hand when a bake is actually wanted.

permissions:
  contents: read

jobs:
  # Install the base system ONCE.
  #
  # Every flavour repeats the same partition, format and unpack of the kernel and
  # base packages inside nixos-install, and there are four flavours. This job does
  # that work a single time; the derive job below boots the result per desktop and
  # runs nixos-rebuild, which only has to add the desktop closure.
  base:
    # Skip when the caller already has a base disk: rebuilding it is five minutes
    # and a 1.8 GiB artifact for nothing, and it was happening on every derive run.
    if: >-
      github.event.inputs.base_artifact_id == '' &&
      (github.event.inputs.mode == 'base' || github.event.inputs.mode == 'derive')
    runs-on: ubuntu-latest
    # The install takes about five minutes, and the ceiling is generous
    # because a slow runner should not turn a good bake red.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils p7zip-full gdisk parted
      - name: install the minimal base
        env:
          OUT: ${{ github.workspace }}/out/nixos-base.qcow2
          # Backstop only: the guest powers itself off after the install, and this
          # is what stops a wedged qemu holding the runner. Comfortably above the
          # five minutes the install actually takes.
          QEMU_MAX: "1500"
        run: |
          set -euo pipefail
          mkdir -p out
          sudo -E bash bake/nixos/bake-nixos-minimal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-base
          path: ${{ github.workspace }}/out/nixos-base.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # One disk per desktop, derived from the base instead of reinstalled.
  #
  # Each job boots the base disk, points /etc/nixos/configuration.nix at its
  # flavour, runs nixos-rebuild boot and collects the old generations. The
  # install work - partition, format, kernel, base packages - happened once in
  # the base job, so what is left per flavour is the desktop closure itself.
  derive:
    # needs is satisfied by base being skipped when a base artifact was supplied;
    # always() is required so a skipped base does not skip this too.
    needs: base
    if: >-
      always() && github.event.inputs.mode == 'derive' &&
      (github.event.inputs.base_artifact_id != '' || needs.base.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        desktop: [labwc, gnome, kde, cosmic, hyprland, niri, miracle]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: skip unless requested
        id: want
        run: |
          want="${{ github.event.inputs.desktops || 'labwc,gnome,kde,cosmic,hyprland,niri,miracle' }}"
          case ",$want," in
            *",${{ matrix.desktop }},"*) echo "go=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "go=0" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: enable KVM
        if: steps.want.outputs.go == '1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: tools
        if: steps.want.outputs.go == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils
      # Either take the base built earlier in this run, or fetch one from a
      # previous run when the caller named it. The second form is the normal
      # case now: the base is an artifact like any other and does not change
      # when a desktop configuration does.
      - uses: actions/download-artifact@v4
        if: steps.want.outputs.go == '1' && github.event.inputs.base_artifact_id != ''
        with:
          artifact-ids: ${{ github.event.inputs.base_artifact_id }}
          path: base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.base_run_id }}
      - uses: actions/download-artifact@v4
        if: steps.want.outputs.go == '1' && github.event.inputs.base_artifact_id == ''
        with:
          name: nixos-base
          path: base
      - name: derive ${{ matrix.desktop }}
        if: steps.want.outputs.go == '1'
        env:
          DESKTOP: ${{ matrix.desktop }}
          OUT: ${{ github.workspace }}/out/nixos-${{ matrix.desktop }}.qcow2
        run: |
          set -euo pipefail
          mkdir -p out
          # Locate the base rather than assume its path: download-artifact with
          # artifact-ids keeps the artifact NAME as a subdirectory (base/nixos-base/
          # nixos-base.qcow2), while the name= form unpacks flat. Hardcoding one
          # layout broke every derive job with 'No such file or directory'.
          base=$(find base -name '*.qcow2' -type f | head -1)
          [ -n "$base" ] || { echo "no qcow2 under base/"; find base | head -20; exit 1; }
          echo "base disk: $base ($(stat -c%s "$base") bytes)"
          sudo -E env BASE="$base" DESKTOP="$DESKTOP" OUT="$OUT" bash bake/nixos/derive.sh
      - name: smoke test derived disk
        if: steps.want.outputs.go == '1'
        env:
          DESKTOP: ${{ matrix.desktop }}
          DISK: ${{ github.workspace }}/out/nixos-${{ matrix.desktop }}.qcow2
          # niri's TTY backend is hardcoded to GbmGlesBackend<GlesRenderer>: it
          # always renders through GBM+GLES on primary_render_node, and QEMU's
          # default VGA exposes card0 but no /dev/dri/renderD128. Its journal says
          # so forty-five times, 'error doing early import: Error::DeviceMissing',
          # while the compositor and its client both run fine and nothing is drawn.
          # virtio-vga still provides a framebuffer for screendump and also
          # publishes a render node.
          QEMU_VGA: ${{ matrix.desktop == 'niri' && 'virtio' || '' }}
        run: sudo -E bash bake/nixos/smoke.sh
        timeout-minutes: 20
      # The guest console is the only place derive failures are explained - Nix
      # evaluation errors, network problems, a build that never finished. Upload
      # it always, including when the step timed out or was cancelled, so there is
      # something to read instead of an empty job log.
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.go == '1'
        with:
          name: derive-log-${{ matrix.desktop }}
          path: |
            derive.log
            derive-guest.sh
            console.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.go == '1'
        with:
          name: screen-${{ matrix.desktop }}-derived
          path: |
            screen.png
            smoke.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        # always(): the disk exists as soon as derive itself succeeds, which is
        # independent of whether the smoke test afterwards passes. Gating this on
        # success threw away a perfectly good 5.9 GiB disk every time the
        # screenshot check failed, and made it impossible to iterate on smoke
        # against an existing disk.
        if: always() && steps.want.outputs.go == '1'
        with:
          name: nixos-${{ matrix.desktop }}-derived
          path: ${{ github.workspace }}/out/nixos-${{ matrix.desktop }}.qcow2
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  # A cheap gate before the expensive one. nixos-install spends ~25 minutes
  # downloading and building before it reports a typo or an option that does not
  # exist in this nixpkgs, so evaluate all four configurations first: seconds
  # instead of an hour per flavour.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: evaluate the base and every flavour
        run: |
          set -euo pipefail
          # Pin nixpkgs explicitly: the bake itself uses nixos-unstable, and
          # <nixpkgs> alone would follow whatever channel the runner happens to
          # have, so a flavour could validate here and fail in the bake.
          NIXPKGS_URL=https://github.com/NixOS/nixpkgs/archive/nixos-unstable.tar.gz
          # The base first: derive.sh replaces /etc/nixos/configuration.nix on the
          # installed base disk with configuration-desktop.nix, so if the base
          # itself does not evaluate there is nothing to derive from.
          echo "=== minimal base ==="
          cp bake/nixos/configuration-minimal.nix /tmp/base.nix
          # No --strict. It forces evaluation of the whole nested attribute set and
          # nix-instantiate segfaulted (exit 139) on the Hyprland closure - not a
          # configuration error, just memory. drvPath is a string, so evaluating it
          # without deep strictness still catches a bad option or a failed assertion,
          # which is the whole point of this gate.
          nix-instantiate -I nixpkgs="$NIXPKGS_URL" --eval \
            -E "(import <nixpkgs/nixos> { configuration = /tmp/base.nix; system = \"x86_64-linux\"; }).config.system.build.toplevel.drvPath" \
            > /dev/null
          echo "   ok"
          # The desktop config imports ./configuration-minimal.nix, a RELATIVE path,
          # so the pair has to sit in the same directory when evaluated. Copying
          # only the desktop file to /tmp broke that: 'path
          # /tmp/configuration-minimal.nix does not exist'.
          mkdir -p /tmp/cfg
          cp bake/nixos/configuration-minimal.nix /tmp/cfg/configuration-minimal.nix
          for d in labwc gnome kde cosmic hyprland niri miracle; do
            echo "=== $d ==="
            sed "s|@DESKTOP@|$d|" bake/nixos/configuration-desktop.nix > /tmp/cfg/$d.nix
            # One-line expression via printf: a heredoc inside a YAML block scalar
            # keeps its indentation, so the closing marker is never at column 0 and
            # bash reports "unexpected end of file" - which is exactly how this
            # step failed the first time.
            printf '%s\n' \
              "(import <nixpkgs/nixos> {" \
              "  configuration = /tmp/cfg/$d.nix;" \
              "  system = \"x86_64-linux\";" \
              "}).config.system.build.toplevel.drvPath" \
              > /tmp/eval-$d.nix
            nix-instantiate -I nixpkgs="$NIXPKGS_URL" --eval /tmp/eval-$d.nix > /dev/null
            echo "   ok"
          done
