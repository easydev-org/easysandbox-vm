name: bake-cachyos

# Bake a CachyOS desktop disk from the official live ISO with its CLI installer,
# then boot it and prove the desktop came up - in one job.

on:
  workflow_dispatch:
    inputs:
      desktops:
        description: "Comma-separated: kde, gnome, xfce, cosmic"
        required: false
        default: "kde"
      cachyos_version:
        description: "CachyOS release, e.g. 260809"
        required: false
        default: "260809"
  push:
    branches: [main]
    paths:
      - "bake/cachyos/**"
      - "bake/lib/**"
      - "bake/nixos/smoke.sh"
      - ".github/workflows/bake-cachyos.yml"

env:
  DESKTOPS: ${{ github.event.inputs.desktops || 'kde' }}
  CACHYOS_VERSION: ${{ github.event.inputs.cachyos_version || '260809' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktops: ${{ steps.m.outputs.desktops }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          json=$(printf '%s' "${DESKTOPS}" \
            | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "desktops=${json}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${json}"

  bake:
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/easydev-org/sandbox-bake-runner:latest
      options: --device /dev/kvm
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.plan.outputs.desktops) }}
    steps:
      - uses: actions/checkout@v4

      # No apt. This job runs inside bake/Containerfile.runner, which is
      # qemux/qemu:7.50 - the same base the production image is built from - and
      # already carries qemu 11.1.0, 7z, xorriso, python3, e2fsprogs and jq. The
      # apt install it replaces took 36s once and 374s another time for the same
      # commit; the difference was the mirror, and under -qq the slow case printed
      # nothing at all and looked like a deadlock.
      - name: tools
        run: |
          . bake/lib/qemu-bake.sh
          echo "=== what this image actually has ==="
          for t in qemu-system-x86_64 qemu-img 7z debugfs python3 curl jq mkfifo timeout setsid; do
            printf '  %-20s ' "$t"
            command -v "$t" 2>/dev/null || echo MISSING
          done
          echo "=== PATH ==="
          echo "$PATH"
          bake_require_tools
      # /dev/kvm is passed to the container by the job definition, so this only
      # reports it. The udev rules the runner-level version wrote are not needed
      # inside a container that was started with the device.
      - name: KVM is available
        run: |
          ls -l /dev/kvm || { echo "no /dev/kvm - the job needs --device /dev/kvm" >&2; exit 1; }
      - name: bake
        env:
          DESKTOP: ${{ matrix.desktop }}
          OUT: ${{ github.workspace }}/out/cachyos-${{ matrix.desktop }}.qcow2
          CACHYOS_VERSION: ${{ env.CACHYOS_VERSION }}
          QEMU_MAX: "3600"
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: bake-cachyos-${{ matrix.desktop }}
          command: |
            set -euo pipefail
            mkdir -p out
            bash bake/cachyos/bake-cachyos.sh
            ls -la out

      - name: what the installer said
        if: always()
        run: |
          ls -la out/ 2>/dev/null || true
          if [ -f out/console.log ]; then
            echo "=== console: $(wc -l < out/console.log) lines ==="
            grep -aE "INSTALL_RC|PACMAN_RC|CACHYOS_BAKE_OK|error|failed|CONFIG_FAIL" \
              out/console.log | tail -40 || true
          fi

      - name: boot it and look at the screen
        if: success()
        env:
          DESKTOP: ${{ matrix.desktop }}
          DISK: ${{ github.workspace }}/out/cachyos-${{ matrix.desktop }}.qcow2
          WAIT: "600"
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: smoke-cachyos-${{ matrix.desktop }}
          command: |
            set -euo pipefail
            bash bake/nixos/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cachyos-${{ matrix.desktop }}-result
          path: |
            out/console.log
            screen.png
            smoke.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cachyos-${{ matrix.desktop }}
          path: out/cachyos-${{ matrix.desktop }}.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
