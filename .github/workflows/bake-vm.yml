name: bake-vm

# Bake Windows and macOS golden disks with dockur, one job per guest.
#
# PRODUCE vs CONSUME. dockur produces the disk: a complete QEMU guest with
# unattended installation wired in, so nothing here drives an installer.
# easysandbox consumes the result through GOLDEN_DISK_IMAGE and stays purely a
# run-time component - it must not grow a second, divergent install path.
#
# WHY THE BAKE IS FOUR STEPS. GitHub has no streaming log API. A running job
# returns 403/404 from /actions/jobs/{id}/logs because the blob is only
# published once the job ends, and /actions/runs/{id}/logs does not exist. The
# one live, documented progress signal is the step list from
# /actions/jobs/{id}. Splitting the bake turns one opaque 90-minute block into
# download -> start -> wait -> extract, so the run reports where it actually is.
# Inside the wait step the script prints a 30s heartbeat with the qcow2 size,
# which is the only health signal visible from the host.
#
# ARCHITECTURE. Windows could be amd64 and arm64 - dockurr/windows is multi-arch
# and would install ARM64 Windows natively on an aarch64 host - but
# ubuntu-24.04-arm provides no /dev/kvm (measured: udevadm trigger -> Failed to
# open the device kvm: Invalid argument). Without KVM the guest falls back to
# TCG where an install takes many hours, so arm64 needs a self-hosted aarch64
# runner and is out of scope. macOS is x86_64 only: dockur/macos pins
# qemu-system-x86_64 and ships X64-only OpenCore.
#
# Deliberately manual: 60-180 minute installs producing 30-100 GiB disks.

on:
  workflow_dispatch:
    inputs:
      guest:
        description: "windows | macos | both"
        required: false
        default: "windows"
      windows_version:
        description: "Windows version for dockur (11, 10, 2022 ...)"
        required: false
        default: "11"
      macos_version:
        # dockur maps these in install.sh: 26/tahoe, 15/sequoia, 14/sonoma,
        # 13/ventura, 12/monterey. VERSION is passed straight through, so adding
        # one needs a dispatch with a different value, not a code change.
        description: "macOS version for dockur (14, 15, 26 ...)"
        required: false
        default: "14"
      keep_container:
        description: "On failure, print the container state and last log lines"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  win-x64:
    if: ${{ github.event.inputs.guest != 'macos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ github.event.inputs.windows_version }}
      STORAGE: ${{ github.workspace }}/storage
      OUT: ${{ github.workspace }}/out/windows-x64.qcow2
    steps:
      - uses: actions/checkout@v4
      - name: bake prepare
        run: sudo -E bash bake/vm/bake-windows.sh prepare
      - name: bake start container
        run: sudo -E bash bake/vm/bake-windows.sh start
      # The long step. It shows as in-progress with a heartbeat every 30s, so a
      # stuck install is distinguishable from a slow one by whether the qcow2
      # size is still moving.
      - name: bake wait for install
        run: sudo -E bash bake/vm/bake-windows.sh wait
      - name: bake extract disk
        run: sudo -E bash bake/vm/bake-windows.sh extract
      - name: debug container
        if: failure() && github.event.inputs.keep_container == 'true'
        run: |
          sudo docker ps -a || true
          sudo docker logs --tail 200 winbake 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: ${{ github.workspace }}/out/windows-x64.qcow2
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  mac-x64:
    if: ${{ github.event.inputs.guest != 'windows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ github.event.inputs.macos_version }}
      ARCH: x64
      STORAGE: ${{ github.workspace }}/storage
      OUT: ${{ github.workspace }}/out/macos-x64.qcow2
    steps:
      - uses: actions/checkout@v4
      # Fails in seconds on an unsupported host or arch rather than after the
      # image download.
      - name: bake prepare
        run: sudo -E bash bake/vm/bake-macos.sh prepare
      - name: bake start container
        run: sudo -E bash bake/vm/bake-macos.sh start
      - name: bake wait for install
        run: sudo -E bash bake/vm/bake-macos.sh wait
      - name: bake extract disk
        run: sudo -E bash bake/vm/bake-macos.sh extract
      - name: debug container
        if: failure() && github.event.inputs.keep_container == 'true'
        run: |
          sudo docker ps -a || true
          sudo docker logs --tail 200 macbake 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-x64
          path: ${{ github.workspace }}/out/macos-x64.qcow2
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
