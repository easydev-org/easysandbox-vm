name: bake-opensuse

# Bake an openSUSE Leap desktop disk from the official DVD with AutoYaST, then
# boot it and prove the desktop came up - in one job.
#
# Fifth distribution. All five now differ in exactly one place: how the installer
# is told what to install.

on:
  workflow_dispatch:
    inputs:
      desktops:
        description: "Comma-separated: gnome, kde, xfce"
        required: false
        default: "gnome"
      opensuse_version:
        description: "Leap version, e.g. 15.6"
        required: false
        default: "15.6"
  push:
    branches: [main]
    paths:
      - "bake/opensuse/**"
      - "bake/lib/**"
      - "bake/nixos/smoke.sh"
      - ".github/workflows/bake-opensuse.yml"

env:
  DESKTOPS: ${{ github.event.inputs.desktops || 'gnome' }}
  OPENSUSE_VERSION: ${{ github.event.inputs.opensuse_version || '15.6' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktops: ${{ steps.m.outputs.desktops }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          json=$(printf '%s' "${DESKTOPS}" \
            | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "desktops=${json}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${json}"

  bake:
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/easydev-org/sandbox-bake-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.plan.outputs.desktops) }}
    steps:
      - uses: actions/checkout@v4

      # No apt. This job runs inside bake/Containerfile.runner, which is
      # qemux/qemu:7.50 - the same base the production image is built from - and
      # already carries qemu 11.1.0, 7z, xorriso, python3, e2fsprogs and jq. The
      # apt install it replaces took 36s once and 374s another time for the same
      # commit; the difference was the mirror, and under -qq the slow case printed
      # nothing at all and looked like a deadlock.
      - name: tools
        run: |
          . bake/lib/qemu-bake.sh
          bake_require_tools
        shell: bash
      # /dev/kvm is passed to the container by the job definition, so this only
      # reports it. The udev rules the runner-level version wrote are not needed
      # inside a container that was started with the device.
      - name: KVM is available
        run: |
          ls -l /dev/kvm || { echo "no /dev/kvm - the job needs --device /dev/kvm" >&2; exit 1; }
        shell: bash
      - name: bake
        env:
          DESKTOP: ${{ matrix.desktop }}
          OUT: ${{ github.workspace }}/out/opensuse-${{ matrix.desktop }}.qcow2
          OPENSUSE_VERSION: ${{ env.OPENSUSE_VERSION }}
          QEMU_MAX: "3600"
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: bake-opensuse-${{ matrix.desktop }}
          command: |
            set -euo pipefail
            mkdir -p out
            bash bake/opensuse/bake-opensuse.sh
            ls -la out

      - name: what the installer said
        if: always()
        run: |
          ls -la out/ 2>/dev/null || true
          if [ -f out/console.log ]; then
            echo "=== console: $(wc -l < out/console.log) lines ==="
            grep -aE "ERROR|Traceback|autoyast|AutoYaST|OPENSUSE_BAKE_OK|Installation complete|failed" \
              out/console.log | tail -40 || true
          fi
        shell: bash
      - name: boot it and look at the screen
        if: success()
        env:
          DESKTOP: ${{ matrix.desktop }}
          DISK: ${{ github.workspace }}/out/opensuse-${{ matrix.desktop }}.qcow2
          WAIT: "600"
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: smoke-opensuse-${{ matrix.desktop }}
          command: |
            set -euo pipefail
            bash bake/nixos/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opensuse-${{ matrix.desktop }}-result
          path: |
            out/console.log
            screen.png
            smoke.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opensuse-${{ matrix.desktop }}
          path: out/opensuse-${{ matrix.desktop }}.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
