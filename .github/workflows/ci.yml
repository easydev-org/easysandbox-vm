name: ci

# Build the VM image and actually boot it.
#
# The previous version of this file checked that a qcow2 existed inside the
# image and never started anything - which is why the vendored runtime could be
# gutted without CI noticing. This one runs the container, lets the boot scripts
# assemble the qemu command line, and requires a guest to appear.
#
# The image embeds no disk: GOLDEN_DISK_URL supplies one at run time, so the
# check is a whole-path check - vendor scripts, qemu, the disk, the guest.

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "start.sh"
      - "golden-disk.sh"
      - "oem-nixos.sh"
      - "00-token.conf"
      - "vendor/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: easydev-org/sandbox-linux-vm
  WORKER_REPO: easydev-org/easyworker
  EASYSTREAM_REPO: easydev-org/easystream

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # No docker/setup-buildx-action, deliberately.
      #
      # That action replaces the default builder with a container-driver one,
      # which has its own image store. push-disk.sh loads the stand-in disk with
      # `docker buildx build --load`, and the Containerfile then does
      # `FROM ${GOLDEN_DISK_IMAGE}` - across two stores, that resolution fails:
      #
      #   ci-disk:local: failed to resolve source metadata for
      #   docker.io/library/ci-disk:local: pull access denied
      #
      # which reads like a registry permission error and is really "wrong
      # store". Leaving the default docker driver in place keeps every step on
      # the daemon's image store, which is what a person running this locally
      # would have.

      - name: resolve release versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          w=$(gh release view --repo "$WORKER_REPO" --json tagName -q .tagName)
          e=$(gh release view --repo "$EASYSTREAM_REPO" --json tagName -q .tagName)
          echo "worker=$w easystream=$e"
          echo "worker=$w" >> "$GITHUB_OUTPUT"
          echo "easystream=$e" >> "$GITHUB_OUTPUT"

      - name: decide the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image embeds a disk, and bake/nixos publishes it as
      # ghcr.io/easydev-org/sandbox-disk-<desktop>. Pulling a real one here would
      # cost 5.6 GiB per run, so CI does what the publish step does, from a small
      # synthetic source: split a sparse file into the same 1 GiB data.partNNN
      # pieces and push it as an image under a throwaway tag.
      #
      # That exercises the real path - the golden stage, the bind mount, the
      # `cat` join, golden-disk.sh making the overlay - with a disk small enough
      # to build in seconds. No guest will boot from zeros, and none needs to: the
      # thing under test is the runtime, not a desktop.
      - name: publish a small stand-in disk image
        run: |
          set -euo pipefail
          truncate -s 1G /tmp/disk.raw
          bash bake/nixos/push-disk.sh /tmp/disk.raw ci-disk:local
          docker images ci-disk:local
          # Same layout the published disks have, so the join step is exercised
          # rather than bypassed.
          docker run --rm --entrypoint sh ci-disk:local -c 'ls /' 2>/dev/null || true

      # Plain `docker build`, NOT docker/build-push-action, and that is the
      # point of this step.
      #
      # The Containerfile's first stage is `FROM ${GOLDEN_DISK_IMAGE}`, and the
      # stand-in disk was just produced into the docker daemon's image store by
      # push-disk.sh. A buildx builder with the container driver has its own
      # store and cannot see it; the build fails with
      #
      #   ci-disk:local: failed to resolve source metadata for
      #   docker.io/library/ci-disk:local: pull access denied
      #
      # which reads like a registry permission problem and is really "that image
      # lives in the other daemon". `docker build` uses the daemon's own store.
      - name: build the image against the stand-in disk
        run: |
          set -euo pipefail
          docker build \
            --file Containerfile \
            --tag "${{ env.IMAGE }}:ci" \
            --build-arg GOLDEN_DISK_IMAGE=ci-disk:local \
            --build-arg WORKER_VERSION="${{ steps.ver.outputs.worker }}" \
            --build-arg EASYSTREAM_VERSION="${{ steps.ver.outputs.easystream }}" \
            --build-arg RELEASE_CACHEBUST="${{ github.run_id }}" \
            .
          docker images "${{ env.IMAGE }}"

      # Static checks first: cheap, and they name the file when they fail.
      - name: the vendored scripts parse
        run: |
          set -euo pipefail
          fail=0
          for f in vendor/run/*.sh; do
            bash -n "$f" || { echo "syntax error in $f"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "all vendored scripts parse"

      # KVM is what makes a boot test finish in minutes instead of hours.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "no /dev/kvm - the boot test cannot run" >&2; exit 1; }

      # THE POINT of this job: the vendored scripts have to reach qemu. A
      # function deleted while still called shows up here and nowhere earlier.
      #
      # The disk is a throwaway filled with zeros, so no guest will boot - and it
      # does not need to. What must happen is that golden-disk.sh accepts the
      # embedded base, builds the overlay, disk.sh turns it into -drive
      # arguments, config.sh assembles the command line, boot.sh adds firmware,
      # and qemu starts with all of it.
      - name: the runtime reaches qemu
        run: |
          set -euo pipefail
          docker run -d --name vm --privileged \
            -e DISPLAY=none \
            -p 8006:8006 \
            "${{ env.IMAGE }}:ci"

          ok=0
          for i in $(seq 1 48); do
            if docker exec vm sh -c 'ps -eo comm= | grep -q qemu-system'; then
              ok=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' vm | grep -q true; then
              echo "container exited before qemu appeared" >&2
              break
            fi
            sleep 5
          done

          echo "=== container log ==="
          docker logs vm 2>&1 | tail -60
          [ "$ok" = 1 ] || { echo "qemu never started" >&2; exit 1; }

          # Prove the command line was assembled rather than half-built. An argv
          # with -drive, -machine and network options can only come from
          # disk.sh, config.sh and network.sh all running to completion.
          docker exec vm sh -c 'ps -eo args= | grep -m1 qemu-system' > /tmp/qemuargs
          cat /tmp/qemuargs
          grep -q -- "-drive" /tmp/qemuargs || { echo "no -drive in the qemu command" >&2; exit 1; }
          grep -qE -- "-machine|-M " /tmp/qemuargs || { echo "no -machine in the qemu command" >&2; exit 1; }
          grep -q -- "-netdev\|-net " /tmp/qemuargs || { echo "no network options in the qemu command" >&2; exit 1; }

      - name: logs and cleanup
        if: always()
        run: |
          docker logs vm > container.log 2>&1 || true
          docker rm -f vm || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-container-log
          path: container.log
          if-no-files-found: warn
          retention-days: 7
