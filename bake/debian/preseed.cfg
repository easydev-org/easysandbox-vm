# Debian preseed for the sandbox disk.
#
# The installer is told where this file is with preseed/url= on the kernel
# command line, which is the same shape as Fedora's inst.ks= and Ubuntu's
# autoinstall ds=nocloud-net;. Debian's own documentation
# (releases/stable/amd64/apbs02) gives the two parameters that make it
# unattended:
#
#   auto=true             alias for auto-install/enable; delays locale and
#                         keyboard questions until they have been preseeded
#   priority=critical     only ask about things this file does not answer
#
# @DESKTOP@ is substituted by bake-debian.sh: gnome | kde | xfce | cinnamon

#### Localisation
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i keymap select us

#### Network
# DHCP on whatever qemu's user-net provides. `interface=auto` on the kernel
# command line picks it up; this is the fallback for the netcfg question.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-sandbox
d-i netcfg/get_domain string localdomain

#### Mirror
# Used to fetch the desktop packages. The netinst ISO carries only the base
# system; everything else comes from here, so this has to be reachable.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

#### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

#### Partitioning
# Whole disk, one ext4 root, no LVM, no swap. There is no confirmation step:
# partman/confirm is preselected yes, or the installer stops and asks.
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Users
# The harness talks to the serial console; this account exists so the desktop
# can autologin and so a failed bake is debuggable. Password "docker", crypted.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string docker
d-i passwd/username string docker
d-i passwd/user-password-crypted password $6$A/F5saPiuPd25jAD$gNjzzSWWt6AKlWj6Q1mr8s..D/PldO73NfTQRKArK.i4YacAMyrA49Ch2od5lVAS/1Y9uVlo.325.iH3SUVAY0
d-i passwd/user-default-groups string audio cdrom video render input sudo

#### Package selection
# No tasksel desktop here: the desktop is installed in late_command with apt, so
# the exact package name is visible in one place instead of being implied by a
# task name that differs between releases.
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server sudo
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

#### Bootloader
# grub-pc, because the disk is partitioned with a DOS label by the atomic
# recipe. The console append is what makes the boot log readable by the harness.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

#### Finish
# Without this the installer stops at "Installation complete" and waits for
# Enter. The harness has nobody to press it.
d-i finish-install/reboot_in_progress note

#### Late command
#
# ONE LINE. preseed is a one-instruction-per-line format and a trailing backslash
# is a literal character, not a continuation - a multi-line late_command is
# parsed as a short command followed by a pile of unknown directives.
#
# The fetch happens in the INSTALLER, not via in-target. `in-target wget` failed
# with exit 127: in-target switches into /target, and the target at this point is
# a bare base system with no wget. Fetching to /tmp here and only then running
# the script inside the target keeps each command in the environment that has it.
#
#   wget -O /tmp/setup.sh http://10.0.2.2:8000/setup.sh
#   in-target sh /tmp/setup.sh @DESKTOP@      # /tmp is visible inside the chroot
#
# @DESKTOP@ is the task name (task-gnome-desktop, task-kde-desktop, ...).
d-i preseed/late_command string wget -O /tmp/setup.sh http://10.0.2.2:8000/setup.sh && cp /tmp/setup.sh /target/tmp/setup.sh && in-target sh /tmp/setup.sh @DESKTOP@
