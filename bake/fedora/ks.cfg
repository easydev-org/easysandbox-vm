#version=DEVEL
# Fedora kickstart for the sandbox disk.
#
# Anaconda reads this from the kernel command line:
#
#   inst.ks=http://10.0.2.2:8000/ks.cfg
#
# Same shape as Ubuntu's autoinstall and NixOS's typed commands. Nothing is typed
# here: the installer fetches this file and runs it.
#
# @DESKTOP@ is substituted by bake-fedora.sh:
#   workstation  GNOME  (Fedora Workstation, the flagship)
#   kde          KDE    (Fedora KDE Plasma Desktop spin)
#   xfce         XFCE   (Fedora Xfce spin)

# No `install` directive: Fedora 44 removed it. Installing is what anaconda does
# unless told otherwise, and the keyword is now an error -
#
#   line 18: install has been removed.
#
# which the run printed and then carried on from, into a fatal error later.

# ---- language and keyboard --------------------------------------------------
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Etc/UTC --utc

# ---- network ----------------------------------------------------------------
# DHCP on whatever qemu's user-net creates. Needed by %post.
network --bootproto=dhcp --device=link --activate --onboot=yes

# ---- disk -------------------------------------------------------------------
# Wipe and use the whole disk. No LVM, no encryption, no swap partition: a
# sandbox disk has to boot; swap inside a qcow2 the host already holds in RAM
# only makes it slower.
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=plain --noswap

# ---- user -------------------------------------------------------------------
# The harness talks to the serial console and to easystream; this account exists
# so the desktop can autologin and so a failed bake is debuggable.
rootpw --lock
user --name=docker --groups=wheel,video,render,audio,input --plaintext --password=docker

# ---- what gets installed ----------------------------------------------------
#
# EVERY package and group name has to be inside %packages. As bare lines at the
# top level they are parsed as kickstart commands, which is what happened:
#
#   line 48: Unknown command: @workstation-product-environment
#   line 56: Unknown command: zenity
#   line 57: Unknown command: wl-clipboard
#
# There is no "install these" directive - the section itself is the directive.
#
# The desktop group is substituted by bake-fedora.sh; the mapping lives in
# bake-fedora.sh so there is one place to look, and it is an environment group
# (@...) rather than a package list.
%packages
@DESKTOP@

# A GTK client, installed but NOT started.
#
# zenity because xterm and foot publish no AT-SPI tree, so /a11y/apps would be
# empty; --pulsate --no-cancel never returns. Not autostarted: a gold disk is a
# stock desktop and nothing else, and the harness starts the client over the
# serial console when it wants a picture. Same rule as every other disk here.
zenity
wl-clipboard
%end

# ---- bootloader -------------------------------------------------------------
# The console log is the whole story, so no graphical splash hides the messages
# the smoke test greps for.
bootloader --location=mbr --append="console=ttyS0,115200n8 net.ifnames=0 biosdevname=0"

# NOT `text`. That directive does two things and only the first is obvious: it
# puts anaconda on a text UI, and it sets the INSTALLED system's default target
# to multi-user.target. The first bake had gdm and gnome-shell installed - 1532
# and 1530 of 1901 packages - and still booted to a black screen with two
# colours, because nothing ever reached graphical.target.
#
# `graphical` is the counterpart. It is the default for a desktop install; it is
# written out because `text` was the mistake and this is where a reader looks.
# Console output is guaranteed by the kernel append above, not by the UI choice.
graphical

# ---- first boot -------------------------------------------------------------
firstboot --disable
services --enabled=sshd,serial-getty@ttyS0

reboot --eject

# ---- post-install -----------------------------------------------------------
%post --erroronfail
set -eux

# The serial console must log in by itself, the same thing NixOS gets from
# services.getty.autologinUser and Ubuntu from a serial-getty override. Without
# it the harness types into a login prompt and fails on "no screenshot" while the
# guest is perfectly healthy.
mkdir -p /etc/systemd/system/serial-getty@ttyS0.service.d
cat > /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf <<'EOF'
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin docker --keep-baud 115200,38400,9600 %I $TERM
EOF
systemctl enable serial-getty@ttyS0.service

# Graphical autologin. gdm reads this key from dconf.
mkdir -p /etc/dconf/db/gdm.d
cat > /etc/dconf/db/gdm.d/00-autologin <<'EOF'
[daemon]
AutomaticLoginEnable=true
AutomaticLogin=docker
EOF
dconf update || true

# Wayland on: the sandbox drives a Wayland desktop, and the a11y path is the
# Wayland session.
mkdir -p /etc/gdm
cat > /etc/gdm/custom.conf <<'EOF'
[daemon]
WaylandEnable=true
AutomaticLoginEnable=true
AutomaticLogin=docker
EOF

# Fedora's default is SELinux enforcing and it is not relaxed casually - but the
# sandbox's own daemon is an unconfined user process that no shipped policy has
# ever heard of, and enforcing blocks it. Permissive keeps the labels and the
# audit trail while letting the sandbox run.
setenforce 0 || true
sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config

# Proof for the bake, read back off the finished disk rather than trusted from
# the installer's own report.
echo FEDORA_BAKE_OK > /var/log/fedora-bake-ok

%end
