# Unattended configuration for MX Linux's installer, gazelle-installer (minstall).
#
# The manpage (src/man/minstall.1 in the gazelle-installer tree) documents the mode
# this relies on:
#
#   --auto           Install automatically using the configuration file. WARNING:
#                    potentially dangerous - it will wipe the partition(s).
#   -c, --config <f> Load a configuration file. Default /etc/minstall.conf.
#   -f, --poweroff   Shut down automatically when done installing.
#   --tui            Text interface (ncurses).
#
# and app.cpp checks for --tui BEFORE constructing a QApplication, so the install
# runs entirely on the serial console with no display server. That is what puts MX
# in a different class from Calamares: a configuration file and a documented
# unattended switch, not just a window.
#
# EVERY KEY BELOW WAS READ OUT OF THE SOURCE, not guessed. The first draft of this
# file had Root, Name, Password, AutoLogin, MakeSwap and BootType - six names that
# look plausible and that the installer would have silently ignored. The real ones
# come from the manage* and get* calls in partman.cpp, autopart.cpp, bootman.cpp,
# crypto.cpp and oobe.cpp.

[Storage]
# The disk to install onto. The installer partitions it itself when Target is set
# and no partition list is given, which is what --auto wants.
Target = /dev/vda
# Format whatever it creates. Without this it stops to ask about reusing an
# existing filesystem.
Format = true
# Do not carry the live session's home across - this is a fresh install.
OldHomeAction = new
# ext4 root; the live system is squashfs and the target is a normal filesystem.
System = ext4

[Swap]
# No swap: this disk exists to be booted and inspected, not to hibernate.
Install = false

[GRUB]
# The keys bootman.cpp actually sets:
#   manageGroupCheckBox("Install", ...)
#   manageRadios("TargetType", 3, grubChoices, ...)
#   manageComboBox("Location", ...)
#   manageCheckBox("HostSpecific", ...)
Install = true
# A 3-way radio: MBR, ESP, or root. MBR is what a BIOS-booted qemu needs, and the
# smoke test boots under BIOS.
TargetType = MBR
Location = /dev/vda
HostSpecific = false
# The serial console has to survive the boot. Without this the smoke test reads
# GRUB and then nothing until its deadline - exactly what the EndeavourOS disk did
# before console=ttyS0 reached its kernel command line.
GRUB_CMDLINE_LINUX_DEFAULT = console=ttyS0,115200n8

[User]
# The harness logs in over ttyS0. --auto cannot prompt, so the passwords go here;
# the installer writes its own configuration to the target but never the passwords.
Username = docker
UserPass = docker
RootPass = docker
Autologin = true
# A normal account, not a root-only install.
EnableRoot = true

[Localization]
Locale = en_US.UTF-8
Timezone = UTC

[Network]
ComputerName = mx-sandbox

[Services]
# Nothing extra: the serial console is the only way in.
