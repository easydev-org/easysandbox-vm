# AgentWorker: the guest-facing boot-fetch listener.
#
# A SEPARATE port (8090) from the runtime's own webserver (WEB_PORT, default
# 8006, which serves noVNC). Two listeners on the same port would clash — that
# is why this file must NOT use WEB_PORT.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    location = /env {
        alias /run/shm/env;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location = /oem.sh {
        alias /opt/easyworker/oem.sh;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location = /worker {
        alias /opt/easyworker/easyworker;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }
    location = /easystream {
        alias /opt/easyworker/easystream;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # The NixOS guests need a binary built INSIDE nixpkgs. The Ubuntu build links
    # glibc 2.39 and libx264 ABI 164; a NixOS guest on nixpkgs-unstable has glibc
    # 2.44 and x264 ABI 165, so it dies with
    #   undefined symbol: x264_encoder_open_164
    # and no symlink can fix an ABI mismatch. flake.nix in the easystream repo
    # builds this variant in CI; oem-nixos.sh fetches it from here.
    location = /easystream-nixos {
        alias /opt/easyworker/easystream-nixos;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
